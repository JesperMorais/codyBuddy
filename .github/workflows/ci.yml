name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  setup-script:
    # Task 15.1: smoke-run the one-shot installer on each supported
    # OS. Uses --skip-voice so the matrix doesn't pay the pip-install
    # cost three times — voice setup is itself covered by per-engine
    # scripts (voice/setup-piper.ps1 etc.) and by Task 15.2's
    # `pnpm doctor` once that lands. The smoke verifies prereq
    # detection, pnpm install, and the .env.example → .env copy.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Run setup.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File setup.ps1 -SkipVoice
      - name: Run setup.sh (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: bash setup.sh --skip-voice
      - name: Verify .env was created
        shell: bash
        run: test -f .env
      - name: Build daemon + extension (so doctor sees compiled output)
        shell: bash
        run: pnpm -r build
      - name: Replace placeholder ANTHROPIC_API_KEY for doctor
        # The .env copied from .env.example carries the literal
        # `sk-ant-...` placeholder, which `pnpm doctor` flags red
        # (correct: the user hasn't really set a key). CI doesn't
        # run any actual Anthropic calls, so we substitute a
        # well-formed-looking dummy that satisfies the doctor's
        # length+prefix sanity check.
        shell: bash
        run: |
          # 80 random-ish hex chars after the prefix; well above
          # the placeholder check.
          DUMMY="sk-ant-ci$(printf 'x%.0s' {1..80})"
          # Cross-platform sed: write a fresh file.
          node -e "
            const fs = require('fs');
            const t = fs.readFileSync('.env', 'utf8');
            fs.writeFileSync('.env',
              t.replace(/^ANTHROPIC_API_KEY=.*$/m, 'ANTHROPIC_API_KEY=$DUMMY'));
          "
      - name: pnpm doctor (Task 15.2 — exit 0 with no reds)
        shell: bash
        run: pnpm doctor
      - name: Build + smoke single-binary daemon (Task 15.6)
        shell: bash
        run: |
          pnpm build:daemon-bin
          cd daemon && node --test test/daemon-bin-smoke.test.mjs
