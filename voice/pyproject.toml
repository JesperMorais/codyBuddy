[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buddy-voice"
version = "0.1.0"
description = "Kokoro TTS + silero-vad sidecar for Coding Buddy"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=12.0",
  "kokoro-onnx>=0.4.0",
  "sounddevice>=0.5.0",
  "numpy>=1.26",
]

# silero-vad pulls in torch (~150MB). Optional so users on the
# chat-only path can skip the download.
#   pip install -e .[vad]
# XTTS-v2 (Task 12.3) pulls in coqui-TTS + torch — large (~2GB once
# the XTTS-v2 checkpoint downloads). Required only for the
# heavyweight character voices (drill_sergeant, pirate, etc).
#   pip install -e .[xtts]
[project.optional-dependencies]
vad = [
  "silero-vad>=5.0",
  "torch>=2.0",
]
xtts = [
  "TTS>=0.22",
  "torch>=2.0",
  "numpy>=1.26",
]

# The voice sidecar's Python code lives in the `buddy_voice` package
# (matching the dist name). Asset dirs (backchannels/, refs/) sit
# alongside the package as plain runtime data — accessed by cwd-
# relative paths from the spawned uvicorn process, not via package
# resources. Issue #99 tracks declaring package-data once non-editable
# installs are supported.
[tool.setuptools]
packages = ["buddy_voice"]
